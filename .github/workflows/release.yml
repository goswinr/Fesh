name: Release with Velopack

on:
  push:
    tags:
      # does not trigger on prerelease tags like 0.30.0-beta1
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: windows-latest # will run commands on powershell, windows is needed so that ATS signtool.exe works inside --azureTrustedSignFile
    # Run in a GitHub Environment so the OIDC token's `sub` claim is the environment form
    # (repo:goswinr@884885/Fesh@600576619:environment:releaseStandalone) instead of the branch/tag ref. This
    # decouples Azure federated login from the tag trigger: the same subject is presented on
    # every release regardless of which tag was pushed. Add required reviewers / branch limits
    # to this environment in repo Settings to gate who can release.
    # The repo uses GitHub's immutable subject, with the ids of the owner (884885) and the repo (600576619),
    # so a repo recreated under the same name after a rename or deletion can't sign. The setting is at
    # GET/PUT repos/goswinr/Fesh/actions/oidc/customization/sub (use_immutable_subject).
    # nuget.org Trusted Publishing in releaseNuget.yml doesn't read `sub`, it checks the repo and owner ids itself.
    environment:
      name: releaseStandalone
    # Least privilege: this workflow only creates the GitHub Releases and with them the -net48 tag,
    # which needs just `contents: write`. Avoid `write-all`, which also grants packages,
    # deployments, actions, security-events, etc. that this job never uses.
    permissions:
      contents: write
      # Required for OIDC: lets the runner request a short-lived federated token from GitHub's
      # OIDC provider, which azure/login exchanges for an Azure access token. No client secret
      # is stored in GitHub. Azure trusts the token only if its `sub` claim matches the
      # federated credential configured on the app registration:
      #   repo:goswinr@884885/Fesh@600576619:environment:releaseStandalone
      id-token: write
    steps:

    - name: Checkout repository
      # Pinned to a full commit SHA (a tag is mutable and can be repointed). Dependabot's
      # github-actions updater bumps both the SHA and the trailing version comment.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Don't leave GITHUB_TOKEN in .git/config, where the vpk / dotnet tooling run later
        # could read it. This job authenticates each tool explicitly, so persistence isn't needed.
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '11.x'

    - name: Run dotnet publish net48
      run: | #shell
        dotnet publish FeshStandalone.fsproj `
          --configuration Release `
          --runtime win-x64 `
          --output bin/publish/net48 `
          --framework net48 `
          --no-self-contained

    - name: Run dotnet publish net8.0
      run: | #shell
        dotnet publish FeshStandalone.fsproj `
          --configuration Release `
          --runtime win-x64 `
          --output bin/publish/net8.0 `
          --framework net8.0-windows `
          --no-self-contained

    - name: Run dotnet publish net10.0
      run: | #shell
        dotnet publish FeshStandalone.fsproj `
          --configuration Release `
          --runtime win-x64 `
          --output bin/publish/net10.0 `
          --framework net10.0-windows `
          --no-self-contained

    - name: Run dotnet publish net11.0
      run: | #shell
        dotnet publish FeshStandalone.fsproj `
          --configuration Release `
          --runtime win-x64 `
          --output bin/publish/net11.0 `
          --framework net11.0-windows `
          --no-self-contained

    - name: Check version consistency of git tag and CHANGELOG.md
      # needs in fsproj:
      # <Target Name="WriteChangelogVersion" AfterTargets="AfterBuild"><!-- for version checks in github tag based builds -->
      #   <WriteLinesToFile File="./bin/ChangelogVersion.txt" Lines="@(CurrentReleaseChangelog)" Overwrite="true" ContinueOnError="false" />
      # </Target>
      id: check_version
      shell: bash
      run: | #shell
        CHANGELOG_VERSION=$(cat ./bin/ChangelogVersion.txt | tr -d '[:space:]')
        if [ "${{ github.ref_name }}" != "$CHANGELOG_VERSION" ]; then
          echo "Version mismatch: git tag (${{ github.ref_name }}) and version in CHANGELOG.md ($CHANGELOG_VERSION) are not the same."
          exit 1
        fi
        echo "CHANGELOG_VERSION=$CHANGELOG_VERSION"
        echo "github.ref_name=${{ github.ref_name }}"
        echo "Version check of git tag and CHANGELOG.md passed successfully."

    - name: Azure login
      # SHA-pinned (mutable tag). This step opens a session that can sign with the org's
      # Trusted Signing certificate, so an upstream tag move here is especially high-impact.
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
      with:
        # OIDC (federated) login — no long-lived client secret in GitHub. Configure a
        # federated credential on the Azure app registration with:
        #   Issuer:  https://token.actions.githubusercontent.com
        #   Subject: repo:goswinr@884885/Fesh@600576619:environment:releaseStandalone
        #   Audience: api://AzureADTokenExchange
        # and grant that app the "Trusted Signing Certificate Profile Signer" role.
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # No enable-AzPSSession: vpk's Azure Trusted Signing authenticates via the Azure CLI
        # credential (the `az login` session this step always creates), not the Az PowerShell
        # module. Enabling the PS session only adds an unused login whose post-job teardown
        # (Clear-AzContext) emits the noisy "Az version is out of date" warnings.

    - name: Install vpk
      # Pin the vpk version (supply-chain): an unpinned `tool install` pulls whatever is latest at
      # build time and runs it against the active signing session. Bump this manually when updating.
      run: dotnet tool install vpk --global --version 1.2.161

    # The update channels. https://docs.velopack.io/packaging/channels
    # See also checkForNewVelopackRelease in Initialize.fs: the app only checks the channel it was packed with.
    # Each channel has its own --packId, so that they install side by side in %LOCALAPPDATA%\<packId>,
    # and its own GitHub release, with a suffix on the tag. dotnetLatest uses the tag that triggered this run.
    #   channel          packId      tag suffix
    #   dotnetFramework  Fesh.net48  -net48     stays on .NET Framework 4.8
    #   dotnet8          Fesh.net8   -net8      stays on .NET 8
    #   dotnet10         Fesh.net10  -net10     stays on .NET 10
    #   dotnetLatest     Fesh                   moves to the newest .NET, now .NET 11
    # All of them use F# 11, see FeshStandalone.fsproj.
    # To move dotnetLatest to .NET 12: replace net11.0 with net12.0 in its publish and pack steps and in FeshStandalone.fsproj.
    # Its installs then get the .NET 12 build as their next update, and Velopack asks to install the .NET 12 Desktop Runtime while applying it.
    # To keep offering .NET 11 too, add a dotnet11 channel like dotnet10, with a net11.0-windows target in FeshStandalone.fsproj and a NET11_0 case in settingsFolder in RunContext.fs.
    #
    # A channel can't be renamed, https://docs.velopack.io/packaging/channels#renaming-a-channel
    # Installs from before these channel names keep checking their old channel:
    # 'framework' for the .NET Framework version, and 'net9', 'net10' or 'net11' for the .NET version with packId Fesh.
    # So each release also uploads copies of releases.dotnetFramework.json and releases.dotnetLatest.json with those names.
    # The old installs see the new build as an update, and after updating they check the new channel.
    # Keep these copies for a while, so that installs that update late move over too.

    - name: Pack, Sign and Release with Velopack .NET Framework 4.8
      # https://docs.velopack.io/reference/cli/content/vpk-windows
      # If you are publishing your application with --no-self-contained,
      # then you should provide the --framework argument. https://docs.velopack.io/packaging/bootstrapping
      env:
        # vpk reads the token from VPK_TOKEN, so it is never placed on the command line / process
        # table. Actions already masks GITHUB_TOKEN in logs; this also covers the arg-exposure path.
        VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # used by `gh release upload` below
      run: |
        vpk download github `
          --repoUrl https://github.com/goswinr/Fesh `
          --outputDir bin/installer/net48 `
          --channel dotnetFramework

        vpk pack `
          --packId Fesh.net48 `
          --packVersion "${{github.ref_name}}"  `
          --packDir bin/publish/net48 `
          --mainExe Fesh.exe `
          --framework net48 `
          --icon Media/logoInstaller.ico  `
          --packAuthors "Goswin R" `
          --releaseNotes .github/InstallNotes-net48.md `
          --azureTrustedSignFile .github/signing-metadata.json `
          --splashImage Media/logo128.png `
          --outputDir bin/installer/net48 `
          --channel dotnetFramework

        # The -net48 tag doesn't exist yet: GitHub creates it at --targetCommitish, the released commit,
        # when vpk publishes the draft release after uploading. So a run that fails before, e.g. at
        # signing, leaves no tag behind. The same goes for the -net8 and -net10 tags.
        vpk upload github `
          --publish `
          --repoUrl https://github.com/goswinr/Fesh `
          --releaseName "Fesh ${{github.ref_name}} net4.8" `
          --tag "${{github.ref_name}}-net48" `
          --targetCommitish "${{github.sha}}" `
          --outputDir bin/installer/net48 `
          --channel dotnetFramework

        # For installs from before the channel was renamed from framework to dotnetFramework, see above.
        Copy-Item bin/installer/net48/releases.dotnetFramework.json bin/installer/net48/releases.framework.json
        gh release upload "${{github.ref_name}}-net48" bin/installer/net48/releases.framework.json --clobber

    - name: Pack, Sign and Release with Velopack .NET 8
      env:
        VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }} # used by vpk instead of --token on the command line
      run: |
        vpk download github `
          --repoUrl https://github.com/goswinr/Fesh `
          --outputDir bin/installer/net8.0 `
          --channel dotnet8

        vpk pack `
          --packId Fesh.net8 `
          --packVersion "${{github.ref_name}}" `
          --packDir bin/publish/net8.0 `
          --mainExe Fesh.exe `
          --framework net8.0-x64-desktop `
          --icon Media/logoInstaller.ico `
          --packAuthors "Goswin R" `
          --releaseNotes .github/InstallNotes-net8.md `
          --azureTrustedSignFile .github/signing-metadata.json `
          --splashImage Media/logo128.png `
          --outputDir bin/installer/net8.0 `
          --channel dotnet8

        vpk upload github `
          --publish `
          --repoUrl https://github.com/goswinr/Fesh `
          --releaseName "Fesh ${{github.ref_name}} net8" `
          --tag "${{github.ref_name}}-net8" `
          --targetCommitish "${{github.sha}}" `
          --outputDir bin/installer/net8.0 `
          --channel dotnet8

    - name: Pack, Sign and Release with Velopack .NET 10
      env:
        VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }} # used by vpk instead of --token on the command line
      run: |
        vpk download github `
          --repoUrl https://github.com/goswinr/Fesh `
          --outputDir bin/installer/net10.0 `
          --channel dotnet10

        vpk pack `
          --packId Fesh.net10 `
          --packVersion "${{github.ref_name}}" `
          --packDir bin/publish/net10.0 `
          --mainExe Fesh.exe `
          --framework net10.0-x64-desktop `
          --icon Media/logoInstaller.ico `
          --packAuthors "Goswin R" `
          --releaseNotes .github/InstallNotes-net10.md `
          --azureTrustedSignFile .github/signing-metadata.json `
          --splashImage Media/logo128.png `
          --outputDir bin/installer/net10.0 `
          --channel dotnet10

        vpk upload github `
          --publish `
          --repoUrl https://github.com/goswinr/Fesh `
          --releaseName "Fesh ${{github.ref_name}} net10" `
          --tag "${{github.ref_name}}-net10" `
          --targetCommitish "${{github.sha}}" `
          --outputDir bin/installer/net10.0 `
          --channel dotnet10

    - name: Pack, Sign and Release with Velopack .NET 11.0 as the latest .NET
      # Last, so that GitHub shows this release as the latest one.
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}   # used by `gh release upload` below
        VPK_TOKEN: ${{secrets.GITHUB_TOKEN}}  # used by vpk instead of --token on the command line
      run: |
        vpk download github `
          --repoUrl https://github.com/goswinr/Fesh `
          --outputDir bin/installer/net11.0 `
          --channel dotnetLatest

        vpk pack `
          --packId Fesh `
          --packVersion ${{github.ref_name}} `
          --packDir bin/publish/net11.0 `
          --mainExe Fesh.exe `
          --framework net11.0-x64-desktop `
          --icon Media/logoInstaller.ico  `
          --packAuthors "Goswin R" `
          --releaseNotes .github/InstallNotes-latest.md `
          --azureTrustedSignFile .github/signing-metadata.json `
          --splashImage Media/logo128.png `
          --outputDir bin/installer/net11.0 `
          --channel dotnetLatest

        vpk upload github `
          --publish `
          --repoUrl https://github.com/goswinr/Fesh `
          --releaseName "Fesh ${{github.ref_name}} net11" `
          --tag ${{github.ref_name}} `
          --outputDir bin/installer/net11.0 `
          --channel dotnetLatest

        # For installs from before the channel was renamed from net9, net10 or net11 to dotnetLatest, see above.
        Copy-Item bin/installer/net11.0/releases.dotnetLatest.json bin/installer/net11.0/releases.net11.json
        Copy-Item bin/installer/net11.0/releases.dotnetLatest.json bin/installer/net11.0/releases.net10.json
        Copy-Item bin/installer/net11.0/releases.dotnetLatest.json bin/installer/net11.0/releases.net9.json
        gh release upload "${{github.ref_name}}" bin/installer/net11.0/releases.net11.json bin/installer/net11.0/releases.net10.json bin/installer/net11.0/releases.net9.json --clobber
