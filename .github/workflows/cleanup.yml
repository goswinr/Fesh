# https://github.com/marketplace/actions/delete-workflow-runs
name: Delete old workflow runs
on:
  schedule:
    - cron: "17 4 * * 1" # Weekly on Monday at 04:17 UTC, away from the busy hour boundary
  # to allow manual triggering of the workflow from the GitHub Actions tab:
  workflow_dispatch:

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:

      - name: Delete successful Dependabot, cleanup and release runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # Match filenames as well as names; both release workflows are disposable.
          delete_workflow_pattern: dependabot|cleanup.yml|release.yml|releaseNuget.yml
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: success


      - name: Keep the latest successful run of each remaining workflow
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          # Keep a successful run for badges (including build.yml).
          # The previous step already removed successes from disposable workflows.
          keep_minimum_runs: 1
          delete_run_by_conclusion_pattern: success

      - name: Delete unsuccessful runs older than 30 days
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: action_required,cancelled,failure,neutral,skipped,stale,timed_out
