name: Build for Standalone and Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The repo default for GITHUB_TOKEN is read/write. A build only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Build FeshHosting.fsproj
        run: dotnet build FeshHosting.fsproj --configuration Release

      # make sure to match release.yml
      - name: Run dotnet publish net48
        run: |
          dotnet publish FeshStandalone.fsproj `
            --configuration Release `
            --runtime win-x64 `
            --framework net48 `
            --no-self-contained

      - name: Run dotnet publish net10.0
        run: |
          dotnet publish FeshStandalone.fsproj `
            --configuration Release `
            --runtime win-x64 `
            --framework net10.0-windows `
            --no-self-contained


