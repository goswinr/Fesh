name: Build and Publish NuGet Package

on:
  push:
    tags:
      # does  trigger on prerelease tags like 0.30.0-beta1 too
      - '*.*.*'

# The repo default for GITHUB_TOKEN is read/write. Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      # Required for nuget.org Trusted Publishing (OIDC): lets the runner request a short-lived
      # token from GitHub's OIDC provider, which NuGet/login exchanges for a temporary API key.
      # No long-lived NUGET_API_KEY secret is stored in GitHub.
      id-token: write

    steps:
    - name: Checkout repository
      # Pinned to a full commit SHA (a tag is mutable and can be repointed). Dependabot's
      # github-actions updater bumps both the SHA and the trailing version comment.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'

    - name: Replace <br> in README.md with two spaces for nuget.org
      run: |
        $content = Get-Content -Path README.md -Raw
        $content = $content -replace "<br>", "  "
        Set-Content -Path README.md -Value $content


    # All four packages are built first and only pushed at the end,
    # so that a failing build can't leave a partial set of packages on nuget.org.

    # build net 10 with no suffix
    - name: Set target framework to net10 in FeshHosting.fsproj
      run: |
        $projFile = Get-Content -Path FeshHosting.fsproj -Raw
        $projFile = $projFile -replace "<TargetFramework>.*?</TargetFramework>", "<TargetFramework>net10.0-windows</TargetFramework>"
        Set-Content -Path FeshHosting.fsproj -Value $projFile

    - name: Dotnet build FeshHosting for net10
      run:  dotnet build FeshHosting.fsproj --configuration Release --output bin/publishNuget/net10

    - name: Check version consistency of git tag and CHANGELOG.md after build
      # needs in fsproj:
      # <Target Name="WriteChangelogVersion" AfterTargets="AfterBuild"><!-- for version checks in github tag based builds -->
      #   <WriteLinesToFile File="./bin/ChangelogVersion.txt" Lines="@(CurrentReleaseChangelog)" Overwrite="true" ContinueOnError="false" />
      # </Target>
      id: check_version
      shell: bash
      # uses the GITHUB_REF_NAME environment variable instead of ${{ github.ref_name }},
      # so that the tag name is never pasted into the script text.
      run: |
        CHANGELOG_VERSION=$(cat ./bin/ChangelogVersion.txt | tr -d '[:space:]')
        if [ "$GITHUB_REF_NAME" != "$CHANGELOG_VERSION" ]; then
          echo "Version mismatch: git tag ($GITHUB_REF_NAME) and version in CHANGELOG.md ($CHANGELOG_VERSION) are not the same."
          exit 1
        fi
        echo "CHANGELOG_VERSION=$CHANGELOG_VERSION"
        echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
        echo "Version check of git tag and CHANGELOG.md passed successfully."

    # now packages with suffix:

    # all of this is only needed because  <TargetFrameworks>net8.0-windows;net472</TargetFrameworks> does no make a valid nuget package for net48
    # so we make a separate build for net8 and net472 and net9

    - name: Set target framework to net472 in FeshHosting.fsproj
      run: |
        $projFile = Get-Content -Path FeshHosting.fsproj -Raw
        $projFile = $projFile -replace "<TargetFramework>.*?</TargetFramework>", "<TargetFramework>net472</TargetFramework>"
        Set-Content -Path FeshHosting.fsproj -Value $projFile

    - name : Set -net472 suffix in changelog
      run: |
        $v = $env:GITHUB_REF_NAME
        $content = Get-Content -Path CHANGELOG.md -Raw
        $content = $content -replace [regex]::Escape($v), "$v-net472"
        Set-Content -Path CHANGELOG.md -Value $content

    - name: Dotnet build FeshHosting for net472
      run: dotnet build FeshHosting.fsproj --configuration Release --output bin/publishNuget/net472


    # now that net472 is done do the same for net8
    - name: Set target framework to net8 in FeshHosting.fsproj
      run: |
        $projFile = Get-Content -Path FeshHosting.fsproj -Raw
        $projFile = $projFile -replace "<TargetFramework>.*?</TargetFramework>", "<TargetFramework>net8.0-windows</TargetFramework>"
        Set-Content -Path FeshHosting.fsproj -Value $projFile

    - name : Set -net8 suffix in changelog
      run: |
        $v = $env:GITHUB_REF_NAME
        $content = Get-Content -Path CHANGELOG.md -Raw
        $content = $content -replace [regex]::Escape("$v-net472"), "$v-net8"
        Set-Content -Path CHANGELOG.md -Value $content

    - name: Dotnet build FeshHosting for net8
      run: dotnet build FeshHosting.fsproj --configuration Release --output bin/publishNuget/net8


    # now that net8 is done do the same for net9
    - name: Set target framework to net9 in FeshHosting.fsproj
      run: |
        $projFile = Get-Content -Path FeshHosting.fsproj -Raw
        $projFile = $projFile -replace "<TargetFramework>.*?</TargetFramework>", "<TargetFramework>net9.0-windows</TargetFramework>"
        Set-Content -Path FeshHosting.fsproj -Value $projFile

    - name : Set -net9 suffix in changelog
      run: |
        $v = $env:GITHUB_REF_NAME
        $content = Get-Content -Path CHANGELOG.md -Raw
        $content = $content -replace [regex]::Escape("$v-net8"), "$v-net9"
        Set-Content -Path CHANGELOG.md -Value $content

    - name: Dotnet build FeshHosting for net9
      run: dotnet build FeshHosting.fsproj --configuration Release --output bin/publishNuget/net9


    # Trusted Publishing: https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
    # nuget.org only issues the key if a Trusted Publishing policy of the user below matches
    # the OIDC token of this run. Configure it on nuget.org -> user name -> Trusted Publishing:
    #   Repository Owner: goswinr
    #   Repository:       Fesh
    #   Workflow File:    releaseNuget.yml   (file name only, no path)
    #   Environment:      (empty)
    # The key is valid for 1 hour, so it is requested only now, after all builds are done.
    - name: NuGet login (OIDC -> temporary API key)
      id: login
      # SHA-pinned (mutable tag): this step holds the key that can publish all packages of the user.
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: goswinr # the nuget.org profile name, not the email address

    - name: Push all NuGet packages to nuget.org
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        $v = $env:GITHUB_REF_NAME
        $packages =
          "net10/Fesh.$v", # net10 has no suffix
          "net472/Fesh.$v-net472",
          "net8/Fesh.$v-net8",
          "net9/Fesh.$v-net9"
        foreach ($p in $packages) {
          # --skip-duplicate so that the workflow can be re-run if only some of the pushes succeeded
          dotnet nuget push "./bin/publishNuget/$p.symbols.nupkg" `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
